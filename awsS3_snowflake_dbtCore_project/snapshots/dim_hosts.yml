snapshots:
  - name: dim_host_snapshot
    relation: ref('dim_host')
    config:
      schema: MEDALLION_GOLD
      database: DBT_ANALYTICS_PLATFORM_BUCKET
      unique_key: HOST_ID
      strategy: timestamp
      updated_at: HOST_CREATED_AT
      dbt_valid_to_current: "to_date('9999-12-31')"
      hard_deletes: ignore
      # strategy: check
      # check_cols: [BOOKING_STATUS]