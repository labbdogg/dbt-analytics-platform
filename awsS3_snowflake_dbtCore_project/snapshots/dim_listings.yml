snapshots:
  - name: dim_listings_snapshot
    relation: ref('dim_listings')
    config:
      schema: MEDALLION_GOLD
      database: DBT_ANALYTICS_PLATFORM_BUCKET
      unique_key: LISTING_ID
      strategy: timestamp
      updated_at: LISTING_CREATED_AT
      dbt_valid_to_current: "to_date('9999-12-31')"
      hard_deletes: ignore
      # strategy: check
      # check_cols: [BOOKING_STATUS]